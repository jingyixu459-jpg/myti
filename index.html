<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MYTI 摸鱼人格图鉴</title>
  <style>
    :root {
      --ink: #101827;
      --paper: #fffaf0;
      --white: #ffffff;
      --muted: #697386;
      --gold: #f3bd2e;
      --gold2: #f8d56a;
      --green: #0f7357;
      --orange: #ef6b3a;
      --blue: #4568f0;
      --line: rgba(16, 24, 39, 0.12);
      --shadow: 8px 8px 0 #101827;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #f4ecdc;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    button {
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: max(16px, env(safe-area-inset-top)) 14px max(22px, env(safe-area-inset-bottom));
    }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 8px 12px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 950;
      letter-spacing: 0;
    }

    .brand-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: var(--gold);
    }

    .pill-btn,
    .secondary-btn,
    .primary-btn {
      min-height: 46px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: #fff;
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 950;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .pill-btn {
      padding: 0 14px;
      border-radius: 999px;
    }

    .primary-btn {
      min-height: 52px;
      padding: 0 20px;
      border-width: 3px;
      background: var(--gold);
      box-shadow: 6px 6px 0 var(--ink);
    }

    .secondary-btn {
      padding: 0 16px;
    }

    .choice:active,
    .primary-btn:active,
    .secondary-btn:active,
    .pill-btn:active,
    .atlas-card:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .screen {
      display: none;
      animation: screenIn 0.42s cubic-bezier(.19, .92, .24, 1) both;
    }

    .screen.active {
      display: block;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hero {
      min-height: calc(100vh - 82px);
      display: grid;
      align-content: center;
      gap: 16px;
    }

    .hero-card,
    .panel {
      border: 3px solid var(--ink);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 6vw, 54px);
      background:
        radial-gradient(circle at 83% 10%, rgba(243, 189, 46, 0.35), transparent 33%),
        linear-gradient(140deg, #fffaf0 0%, #ffffff 56%, #edf7ee 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(220px, 0.88fr);
      align-items: center;
      gap: 18px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(42px, 12vw, 88px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .hero-copy {
      max-width: 560px;
      margin: 0;
      color: #3f4654;
      font-size: clamp(16px, 3.8vw, 21px);
      line-height: 1.72;
      font-weight: 760;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .hero-art {
      display: grid;
      place-items: center;
      min-height: 320px;
    }

    #heroAvatar,
    #resultAvatar {
      width: min(340px, 76vw);
      height: min(340px, 76vw);
      filter: drop-shadow(0 22px 18px rgba(16, 24, 39, 0.18));
    }

    .stamp {
      position: absolute;
      right: 16px;
      bottom: 16px;
      transform: rotate(-7deg);
      padding: 8px 11px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: #fff;
      color: var(--green);
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 950;
    }

    .play-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 330px);
      gap: 16px;
      align-items: stretch;
    }

    .scene-panel {
      overflow: hidden;
      min-height: 520px;
      display: grid;
      grid-template-rows: minmax(250px, 1fr) auto;
      background:
        linear-gradient(180deg, rgba(255, 250, 240, 0.92), rgba(255, 255, 255, 0.92));
    }

    #sceneCanvas {
      width: 100%;
      min-height: 270px;
      height: 48vh;
      max-height: 440px;
      border-bottom: 3px solid var(--ink);
      background: #fffaf0;
    }

    .dialogue {
      padding: clamp(16px, 4vw, 24px);
    }

    .dialogue-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .speaker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-weight: 950;
      letter-spacing: 0.02em;
    }

    .speaker::before {
      content: "";
      width: 12px;
      height: 12px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--gold);
    }

    .progress-text {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .dialogue-text {
      min-height: 72px;
      margin: 0;
      font-size: clamp(22px, 5.2vw, 36px);
      line-height: 1.26;
      font-weight: 950;
      letter-spacing: 0;
    }

    .subline {
      margin: 8px 0 0;
      color: #5a6273;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 760;
    }

    .choices {
      display: grid;
      gap: 11px;
      margin-top: 16px;
    }

    .choice {
      min-height: 60px;
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: #fff;
      box-shadow: 4px 4px 0 var(--ink);
      text-align: left;
      font-weight: 850;
      line-height: 1.45;
      animation: choiceIn 0.32s cubic-bezier(.18, .86, .25, 1.18) both;
    }

    .choice:hover {
      background: #fff2c8;
    }

    .choice b {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--gold);
      font-size: 18px;
      font-weight: 950;
    }

    @keyframes choiceIn {
      from {
        opacity: 0;
        transform: translateX(18px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .side-panel {
      padding: 16px;
      background:
        radial-gradient(circle at 50% 12%, rgba(243, 189, 46, 0.25), transparent 38%),
        rgba(255, 255, 255, 0.92);
    }

    .side-title {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 950;
    }

    .progress-bar {
      height: 14px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .progress-bar span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--orange));
      transition: width 0.35s ease;
    }

    .status-card {
      margin-top: 14px;
      padding: 13px;
      border: 2px dashed rgba(16, 24, 39, 0.28);
      border-radius: 16px;
      background: rgba(255, 250, 240, 0.8);
      color: #4a5262;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 760;
    }

    .mini-log {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .log-item {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.68);
      color: #545c6e;
      font-size: 12px;
      font-weight: 800;
    }

    .result-wrap {
      display: grid;
      grid-template-columns: minmax(0, 0.98fr) minmax(0, 1.02fr);
      gap: 16px;
      align-items: stretch;
    }

    .result-card {
      overflow: hidden;
      position: relative;
      min-height: 560px;
      padding: clamp(18px, 5vw, 30px);
      background:
        radial-gradient(circle at 78% 8%, rgba(243, 189, 46, 0.35), transparent 32%),
        linear-gradient(150deg, #fffaf0 0%, #ffffff 58%, #edf7ee 100%);
    }

    .result-label {
      display: inline-flex;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    .result-cn {
      margin: 16px 0 0;
      font-size: clamp(34px, 9vw, 64px);
      line-height: 1;
      letter-spacing: 0;
    }

    .result-en {
      margin: 8px 0 10px;
      color: var(--green);
      font-size: clamp(22px, 7vw, 46px);
      font-weight: 950;
      letter-spacing: 0.03em;
    }

    .result-desc {
      margin: 0;
      color: #414958;
      font-size: 16px;
      line-height: 1.75;
      font-weight: 780;
    }

    .result-art {
      display: grid;
      place-items: center;
      margin: 10px 0;
    }

    .result-side {
      padding: clamp(18px, 5vw, 28px);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .chip {
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      font-size: 12px;
      font-weight: 950;
    }

    .score-grid {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .score-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
    }

    .score-item strong {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .share-card,
    .match-card,
    .match-result {
      margin-top: 14px;
      padding: 13px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .share-card strong,
    .match-card strong,
    .match-result strong {
      display: block;
      margin-bottom: 9px;
      font-size: 15px;
      font-weight: 950;
    }

    .code-row,
    .match-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .code-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 118px;
      padding: 0 14px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--gold);
      color: var(--ink);
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 0.12em;
    }

    .small-btn {
      min-height: 44px;
      padding: 0 12px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      box-shadow: 3px 3px 0 var(--ink);
      font-weight: 900;
    }

    .match-input {
      min-height: 44px;
      width: min(145px, 100%);
      padding: 0 12px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: 950 18px system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      outline: none;
    }

    .match-result {
      display: none;
      box-shadow: none;
      border-style: dashed;
    }

    .match-result.show {
      display: block;
    }

    .match-score {
      margin: 2px 0 8px;
      color: var(--green);
      font-size: 34px;
      font-weight: 950;
      line-height: 1;
    }

    .match-text {
      margin: 0;
      color: #444c5d;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 760;
    }

    .share-hint {
      margin: 8px 0 0;
      color: #687085;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 760;
    }

    .meter-track {
      height: 13px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .meter-fill {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .atlas-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 0;
    }

    .atlas-head h2 {
      margin: 0;
      font-size: clamp(32px, 8vw, 56px);
      line-height: 1;
    }

    .atlas-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding-bottom: 24px;
    }

    .atlas-card {
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: #fff;
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .atlas-card:hover {
      background: #fff5d9;
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--ink);
    }

    .mini-avatar {
      width: 100%;
      height: 176px;
      border: 2px solid rgba(16, 24, 39, 0.12);
      border-radius: 12px;
      background: #f8fafc;
    }

    .atlas-card h3 {
      margin: 10px 0 2px;
      font-size: 21px;
      line-height: 1.08;
    }

    .atlas-card .en {
      color: var(--green);
      font-weight: 950;
      letter-spacing: 0.06em;
    }

    .atlas-card p {
      margin: 8px 0 0;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 720;
    }

    .dims {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 10px;
    }

    .dim {
      padding: 4px 0;
      border-radius: 8px;
      background: #eef1f5;
      text-align: center;
      font-size: 10px;
      font-weight: 950;
      color: #4b5563;
    }

    .dim.high {
      background: var(--ink);
      color: #fff;
    }

    #errorOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(255, 250, 240, 0.95);
      color: var(--ink);
      text-align: center;
      font-size: 20px;
      font-weight: 950;
    }

    @media (max-width: 820px) {
      .hero-grid,
      .play-layout,
      .result-wrap {
        grid-template-columns: 1fr;
      }

      .hero-art {
        min-height: 240px;
        order: -1;
      }

      .stamp {
        position: static;
        width: fit-content;
        margin-top: 14px;
      }

      #sceneCanvas {
        height: 42vh;
        min-height: 250px;
      }

      .side-panel {
        order: -1;
      }

      .atlas-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .hero-card,
      .panel {
        box-shadow: 6px 6px 0 var(--ink);
      }
    }

    @media (max-width: 430px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand {
        font-size: 13px;
      }

      .pill-btn {
        padding: 0 10px;
      }

      .atlas-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div id="errorOverlay">哎呀，出错了，请重启试试吧~</div>

  <main class="app">
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span><span>MYTI 摸鱼人格图鉴</span></div>
        <button class="pill-btn" id="atlasTopBtn" type="button">图鉴</button>
      </header>

      <section class="screen active" id="homeScreen">
        <div class="hero">
          <article class="hero-card">
            <div class="hero-grid">
              <div>
                <span class="eyebrow">OFFICE PERSONALITY TEST</span>
                <h1>摸鱼人格<br>图鉴</h1>
                <p class="hero-copy">全球首个基于工位行为学的精神状态测试。你只需要在 12 个离谱上班情境里做选择，系统会在后台计算你的演技、摸鱼、发疯和生存四维。</p>
                <div class="action-row">
                  <button class="primary-btn" id="startBtn" type="button">进入九点办公室</button>
                  <button class="secondary-btn" id="quickAtlasBtn" type="button">先看 16 种人格</button>
                </div>
              </div>
              <div class="hero-art">
                <canvas id="heroAvatar" width="360" height="360"></canvas>
              </div>
            </div>
            <div class="stamp">半动画互动版</div>
          </article>
        </div>
      </section>

      <section class="screen" id="playScreen">
        <div class="play-layout">
          <article class="panel scene-panel">
            <canvas id="sceneCanvas"></canvas>
            <div class="dialogue">
              <div class="dialogue-top">
                <div class="speaker" id="speakerName">工位影帝</div>
                <div class="progress-text" id="progressText">开场动画</div>
              </div>
              <h2 class="dialogue-text" id="dialogueText"></h2>
              <p class="subline" id="dialogueSub">点击继续，让精神状态加载进办公室。</p>
              <div class="choices" id="choices"></div>
              <div class="action-row" id="continueRow">
                <button class="primary-btn" id="continueBtn" type="button">继续</button>
              </div>
            </div>
          </article>

          <aside class="panel side-panel">
            <h2 class="side-title">后台正在生成你的 MYTI</h2>
            <div class="progress-bar"><span id="progressFill"></span></div>
            <div class="status-card" id="statusCard">四维结果暂时隐藏。请按直觉选择，不要试图维护形象，系统比老板更懂你。</div>
            <div class="mini-log" id="miniLog"></div>
          </aside>
        </div>
      </section>

      <section class="screen" id="resultScreen">
        <div class="result-wrap">
          <article class="panel result-card">
            <span class="result-label">你的 MYTI 人格是</span>
            <h2 class="result-cn" id="resultName"></h2>
            <div class="result-en" id="resultCode"></div>
            <p class="result-desc" id="resultDesc"></p>
            <div class="result-art">
              <canvas id="resultAvatar" width="360" height="360"></canvas>
            </div>
            <p class="result-desc" id="resultSlogan"></p>
          </article>

          <aside class="panel result-side">
            <h2 class="side-title">四维判定</h2>
            <div class="chips" id="resultChips"></div>
            <div class="score-grid" id="resultScores"></div>
            <div class="share-card">
              <strong>我的匹配代码</strong>
              <div class="code-row">
                <span class="code-pill" id="shareCode">生成中</span>
                <button class="small-btn" id="copyCodeBtn" type="button">复制</button>
              </div>
              <p class="share-hint" id="shareHint">通过本地后端打开页面后，测试结果会自动保存并生成代码。</p>
            </div>
            <div class="match-card">
              <strong>两人匹配度测试</strong>
              <div class="match-row">
                <input class="match-input" id="matchCodeA" maxlength="8" placeholder="我的代码">
                <input class="match-input" id="matchCodeB" maxlength="8" placeholder="对方代码">

    class ErrorHandler {
      constructor() {
        this.overlay = document.getElementById("errorOverlay");
        window.addEventListener("error", () => this.show());
        window.addEventListener("unhandledrejection", () => this.show());
      }

      show() {
        if (this.overlay) this.overlay.style.display = "flex";
      }

      run(fn) {
        try {
          fn();
        } catch (error) {
          console.error(error);
          this.show();
        }
      }
    }

    class Store {
      static save(data) {
        try {
          localStorage.setItem("myti_result_v2", JSON.stringify(data));
        } catch (error) {}
      }

      static load() {
        try {
          const raw = localStorage.getItem("myti_result_v2");
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
        }
      }
    }

    class ApiClient {
      static async saveResult(payload) {
        const response = await fetch("/api/results", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error("save failed");
        return response.json();
      }

      static async getMatch(codeA, codeB) {
        const query = new URLSearchParams({ codeA, codeB });
        const response = await fetch(`/api/match?${query.toString()}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "match failed");
        return data;
      }
    }

    class BackgroundFX {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.w = 0;
        this.h = 0;
        this.dpr = 1;
        this.t = 0;
        this.particles = [];
        this.resize();
        window.addEventListener("resize", () => this.resize());
      }

      resize() {
        this.dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        this.w = window.innerWidth;
        this.h = window.innerHeight;
        this.canvas.width = Math.floor(this.w * this.dpr);
        this.canvas.height = Math.floor(this.h * this.dpr);
        this.canvas.style.width = this.w + "px";
        this.canvas.style.height = this.h + "px";
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      burst(x, y, color) {
        for (let i = 0; i < 28; i++) {
          this.particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 8,
            vy: -Math.random() * 6 - 1,
            age: 0,
            life: 700 + Math.random() * 520,
            size: 4 + Math.random() * 8,
            color: color || ["#f3bd2e", "#0f7357", "#ef6b3a", "#101827"][i % 4]
          });
        }
      }

      update(dt) {
        this.t += dt;
        this.particles.forEach(p => {
          p.age += dt;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.12;
        });
        this.particles = this.particles.filter(p => p.age < p.life);
      }

      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.w, this.h);
        const g = ctx.createLinearGradient(0, 0, 0, this.h);
        g.addColorStop(0, "#fff9ec");
        g.addColorStop(0.58, "#f5eee2");
        g.addColorStop(1, "#e6d6bf");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, this.w, this.h);

        ctx.strokeStyle = "rgba(16,24,39,0.045)";
        ctx.lineWidth = 1;
        const grid = 44;
        for (let x = -grid; x < this.w + grid; x += grid) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + this.h * 0.16, this.h);
          ctx.stroke();
        }
        for (let y = 0; y < this.h + grid; y += grid) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(this.w, y);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(243,189,46,0.16)";
        ctx.beginPath();
        ctx.arc(this.w * 0.82, this.h * 0.16, 150 + Math.sin(this.t / 900) * 8, 0, Math.PI * 2);
        ctx.fill();

        this.particles.forEach(p => {
          const alpha = Math.max(0, 1 - p.age / p.life);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.age / 150);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx.restore();
          ctx.globalAlpha = 1;
        });
      }

      loop(last = performance.now()) {
        const now = performance.now();
        const dt = Math.min(50, now - last);
        this.update(dt);
        this.draw();
        requestAnimationFrame(() => this.loop(now));
      }
    }

    class CanvasTools {
      static setup(canvas) {
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        const w = Math.max(120, rect.width || canvas.width || 320);
        const h = Math.max(120, rect.height || canvas.height || 240);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { ctx, w, h };
      }

      static round(ctx, x, y, w, h, r, fill, stroke, line = 2) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);

        if (motif === "paper") {
          CanvasTools.round(ctx, cx + 48*s, cy - 65*s, 50*s, 64*s, 8*s, "#fff", "#101827", 2*s);

      static sunglasses(ctx, cx, cy, s) {
        AvatarV2.poly(ctx, [[cx-39*s,cy-95*s],[cx-6*s,cy-99*s],[cx-12*s,cy-72*s],[cx-41*s,cy-79*s]], "#202633");
        AvatarV2.poly(ctx, [[cx+1*s,cy-99*s],[cx+39*s,cy-103*s],[cx+34*s,cy-78*s],[cx+7*s,cy-72*s]], "#202633");
        ctx.fillStyle = "#202633";
        ctx.fillRect(cx-8*s, cy-95*s, 14*s, 4*s);
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.fillRect(cx-32*s, cy-91*s, 11*s, 4*s);
      }

      static frontProps(ctx, cx, cy, s, motif, pal, mood) {
        if (motif === "crown") AvatarV2.trophy(ctx, cx-78*s, cy-62*s, s*0.72);
        if (motif === "wifi") {
          AvatarV2.laptop(ctx, cx+12*s, cy+44*s, s);
          AvatarV2.files(ctx, cx-72*s, cy+54*s, s);
          AvatarV2.trophy(ctx, cx-93*s, cy-70*s, s*0.48);
        }
        if (motif === "glasses") AvatarV2.sparkles(ctx, cx+83*s, cy-111*s, s);
        if (motif === "shadow") {
          ctx.globalAlpha = 0.52;
          CanvasTools.round(ctx, cx-74*s, cy-126*s, 148*s, 184*s, 16*s, "#101827");
          ctx.globalAlpha = 1;
        }
        if (motif === "crack") {
          AvatarV2.sticky(ctx, cx, cy, s);
          AvatarV2.coffee(ctx, cx+76*s, cy-42*s, s);
        }
        if (["moon", "sleep"].includes(motif)) {
          CanvasTools.text(ctx, "Z", cx+64*s, cy-142*s+Math.sin(mood/300)*4*s, 30*s, "#7b2f70");
          CanvasTools.text(ctx, "z", cx+90*s, cy-166*s, 20*s, "#7b2f70");
          AvatarV2.clipboard(ctx, cx+70*s, cy-20*s, s, "勿扰");
        }
        if (motif === "reply") {
          AvatarV2.clipboard(ctx, cx-74*s, cy-45*s, s, "收到");
          AvatarV2.coffee(ctx, cx+72*s, cy-18*s, s);
        }
        if (motif === "totem") {
          AvatarV2.files(ctx, cx-78*s, cy+58*s, s);
          AvatarV2.trophy(ctx, cx+86*s, cy-72*s, s*0.58);
        }
        if (motif === "paper") {
          AvatarV2.flyingPapers(ctx, cx, cy, s, mood);
          AvatarV2.clipboard(ctx, cx+68*s, cy-20*s, s, "请冷静");
        }
        if (["leaf", "camo"].includes(motif)) {
          AvatarV2.plant(ctx, cx+72*s, cy+22*s, s);
          if (motif === "leaf") AvatarV2.files(ctx, cx-80*s, cy+72*s, s);
        }
        if (motif === "door") {
          CanvasTools.round(ctx, cx-8*s, cy-126*s, 14*s, 186*s, 2*s, "#303847", "#101827", 2*s);
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = "#101827";
          ctx.fillRect(cx-110*s, cy-126*s, 100*s, 186*s);
          ctx.globalAlpha = 1;
          AvatarV2.clipboard(ctx, cx+72*s, cy-28*s, s, "辞职中");
        }
        if (motif === "bandage") {
          AvatarV2.shield(ctx, cx-78*s, cy-10*s, s);
          AvatarV2.tools(ctx, cx+82*s, cy-20*s, s);
        }
        if (motif === "dice") AvatarV2.megaphone(ctx, cx+84*s, cy-42*s, s);
        if (motif === "fog") {
          AvatarV2.briefcase(ctx, cx-76*s, cy+42*s, s);
          ctx.globalAlpha = 0.25;
          ctx.fillStyle = "#8aa0a5";
          ctx.beginPath();
          ctx.ellipse(cx, cy-18*s, 106*s, 145*s, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      static backProps(ctx, cx, cy, s, motif, pal, mood) {
        if (motif === "wifi") {
          ctx.strokeStyle = "rgba(75,33,78,0.45)";
          ctx.lineWidth = 5*s;
          for (let i = 1; i <= 3; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy-132*s, (34+i*22+Math.sin(mood/400)*2)*s, Math.PI*1.12, Math.PI*1.88);
            ctx.stroke();
          }
        }
        if (["paper", "crack"].includes(motif)) AvatarV2.flyingPapers(ctx, cx, cy, s, mood);
      }

      static badge(ctx, x, y, s, pal) {
        CanvasTools.round(ctx, x, y, 24*s, 33*s, 4*s, "#f5ead6", "#101827", 1.5*s);
        ctx.fillStyle = pal.accent;
        ctx.beginPath();
        ctx.arc(x+12*s, y+12*s, 5*s, 0, Math.PI*2);
        ctx.fill();
      }

      static chair(ctx, cx, cy, s) {
        CanvasTools.round(ctx, cx-64*s, cy-44*s, 128*s, 77*s, 18*s, "rgba(16,24,39,0.2)", "#101827", 1.5*s);
        ctx.fillStyle = "#101827";
        ctx.fillRect(cx-4*s, cy+28*s, 8*s, 65*s);
        ctx.fillRect(cx-35*s, cy+88*s, 70*s, 8*s);
      }

      static zenBase(ctx, cx, cy, s, pal) {
        AvatarV2.files(ctx, cx, cy+78*s, s*1.05);
      }

      static trophy(ctx, x, y, s) {
        AvatarV2.poly(ctx, [[x-14*s,y-30*s],[x+14*s,y-30*s],[x+9*s,y-4*s],[x-9*s,y-4*s]], "#f3bd2e", "#7a560b", 1.5*s);
        ctx.fillStyle = "#d6a21f";
        ctx.fillRect(x-4*s, y-4*s, 8*s, 24*s);
        CanvasTools.round(ctx, x-20*s, y+18*s, 40*s, 10*s, 3*s, "#2b2d34");
        AvatarV2.poly(ctx, [[x-5*s,y-40*s],[x,y-53*s],[x+5*s,y-40*s],[x+18*s,y-38*s],[x+7*s,y-31*s],[x+12*s,y-18*s],[x,y-26*s],[x-12*s,y-18*s],[x-7*s,y-31*s],[x-18*s,y-38*s]], "#f3bd2e");
      }

      static coffee(ctx, x, y, s) {
        CanvasTools.round(ctx, x-14*s, y-18*s, 28*s, 36*s, 6*s, "#5a402f", "#101827", 1.5*s);
        ctx.fillStyle = "#f5ead6";
        ctx.fillRect(x-13*s, y-7*s, 26*s, 12*s);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2*s;
        ctx.beginPath();
        ctx.arc(x+15*s, y, 8*s, -Math.PI/2, Math.PI/2);
        ctx.stroke();
      }

      static laptop(ctx, x, y, s) {
        CanvasTools.round(ctx, x-50*s, y-48*s, 100*s, 62*s, 5*s, "#303847", "#101827", 2*s);
        AvatarV2.poly(ctx, [[x-62*s,y+15*s],[x+62*s,y+15*s],[x+48*s,y+35*s],[x-48*s,y+35*s]], "#1d2430", "#101827", 2*s);
        AvatarV2.poly(ctx, [[x-7*s,y-22*s],[x+8*s,y-17*s],[x+2*s,y-5*s],[x-9*s,y-9*s]], "#d8a72c");
      }

      static files(ctx, x, y, s) {
        for (let i = 0; i < 4; i++) {
          CanvasTools.round(ctx, x-32*s, y-i*9*s, 64*s, 11*s, 2*s, i%2 ? "#e7dfd0" : "#c6b39a", "#101827", 1*s);
        }
      }

      static sticky(ctx, cx, cy, s) {
        const notes = [[-70,-52,"KPI"],[-45,0,"DDL"],[52,-86,"急"],[42,20,"摸鱼"]];
        notes.forEach(n => {
          ctx.save();
          ctx.translate(cx+n[0]*s, cy+n[1]*s);
          ctx.rotate((n[0]%20)*0.02);
          CanvasTools.round(ctx, -14*s, -10*s, 28*s, 20*s, 3*s, "#e9cf68", "#8a6a18", 1*s);
          CanvasTools.text(ctx, n[2], 0, 0, 7*s, "#101827");
          ctx.restore();
        });
      }

      static flyingPapers(ctx, cx, cy, s, mood) {
        for (let i = 0; i < 8; i++) {
          const a = i * 0.8 + mood / 650;
          const x = cx + Math.cos(a) * (72 + i * 5) * s;
          const y = cy - 86*s + Math.sin(a * 1.3) * 55*s;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(a);
          AvatarV2.poly(ctx, [[-9*s,-6*s],[9*s,-4*s],[7*s,8*s],[-7*s,6*s]], "#f2f0e7", "#c8c3b5", 0.8*s);
          ctx.restore();
        }
      }

      static plant(ctx, x, y, s) {
        CanvasTools.round(ctx, x-22*s, y+32*s, 44*s, 34*s, 5*s, "#4d4639", "#101827", 1.5*s);
        ctx.fillStyle = "#2f7c4f";
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath();
          ctx.ellipse(x+i*10*s, y+(Math.abs(i)*5)*s, 12*s, 35*s, i*0.35, 0, Math.PI*2);
          ctx.fill();
        }
      }

      static binoculars(ctx, x, y, s) {
        CanvasTools.round(ctx, x-22*s, y-10*s, 20*s, 18*s, 6*s, "#17212c", "#101827", 1*s);
        CanvasTools.round(ctx, x+2*s, y-10*s, 20*s, 18*s, 6*s, "#17212c", "#101827", 1*s);
        ctx.fillStyle = "#5f7c84";
        ctx.fillRect(x-2*s, y-4*s, 4*s, 8*s);
      }

      static clipboard(ctx, x, y, s, text) {
        CanvasTools.round(ctx, x-24*s, y-28*s, 48*s, 58*s, 5*s, "#f5ead6", "#101827", 1.5*s);
        CanvasTools.round(ctx, x-12*s, y-34*s, 24*s, 10*s, 4*s, "#d1b16a", "#101827", 1*s);
        CanvasTools.text(ctx, text, x, y-2*s, 8*s, "#101827");
      }

      static shield(ctx, x, y, s) {
        AvatarV2.poly(ctx, [[x-32*s,y-40*s],[x+28*s,y-30*s],[x+20*s,y+36*s],[x-8*s,y+58*s],[x-38*s,y+18*s]], "#9aa3ad", "#101827", 2*s);
        AvatarV2.poly(ctx, [[x-16*s,y-25*s],[x+18*s,y-20*s],[x+12*s,y+22*s],[x-5*s,y+36*s],[x-24*s,y+12*s]], "#c7d0d8");
      }

      static tools(ctx, x, y, s) {
        ctx.strokeStyle = "#536273";
        ctx.lineWidth = 5*s;
        ctx.beginPath();
        ctx.moveTo(x-12*s,y-44*s); ctx.lineTo(x+18*s,y+44*s);
        ctx.moveTo(x+18*s,y-44*s); ctx.lineTo(x-14*s,y+42*s);
        ctx.stroke();
      }

      static megaphone(ctx, x, y, s) {
        AvatarV2.poly(ctx, [[x-30*s,y-14*s],[x+8*s,y-30*s],[x+8*s,y+30*s],[x-30*s,y+14*s]], "#f3bd2e", "#101827", 2*s);
        ctx.fillStyle = "#101827";
        ctx.fillRect(x-38*s, y-9*s, 12*s, 18*s);
        ctx.strokeStyle = "#101827";
        ctx.lineWidth = 4*s;
        ctx.beginPath();
        ctx.moveTo(x-20*s, y+13*s); ctx.lineTo(x-4*s, y+42*s);
        ctx.stroke();
      }

      static starGlasses(ctx, cx, cy, s) {
        CanvasTools.text(ctx, "★", cx-20*s, cy-91*s, 28*s, "#f3bd2e");
        CanvasTools.text(ctx, "★", cx+18*s, cy-94*s, 28*s, "#f3bd2e");
      }

      static briefcase(ctx, x, y, s) {
        CanvasTools.round(ctx, x-38*s, y-26*s, 76*s, 54*s, 7*s, "#202633", "#101827", 2*s);
        CanvasTools.round(ctx, x-16*s, y-38*s, 32*s, 14*s, 5*s, "#202633", "#101827", 2*s);
        ctx.fillStyle = "#d2a34b";
        ctx.fillRect(x-6*s, y-4*s, 12*s, 9*s);
      }

      static sparkles(ctx, x, y, s) {
        for (let i = 0; i < 3; i++) {
          const ox = i * 20*s;
          AvatarV2.poly(ctx, [[x+ox,y-12*s],[x+5*s+ox,y],[x+ox,y+12*s],[x-5*s+ox,y]], "#f3bd2e");
        }
      }
    }

    Avatar.draw = AvatarV2.draw;
    Avatar.drawAt = AvatarV2.drawAt;

    class SceneRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.scene = "intro";
        this.type = TYPE_DATA.HHLH;
        this.questionIndex = 0;
        this.selected = null;
        this.t = 0;
        window.addEventListener("resize", () => this.draw());
      }

      set(scene, type, questionIndex, selected = null) {
        this.scene = scene;
        this.type = type || this.type;
        this.questionIndex = questionIndex || 0;
        this.selected = selected;
        this.draw();
      }

      update(dt) {
        this.t += dt;
      }

      draw() {
        const { ctx, w, h } = CanvasTools.setup(this.canvas);
        this.w = w;
        this.h = h;
        ctx.clearRect(0, 0, w, h);
        this.drawRoom(ctx, w, h);
        this.drawSceneDetails(ctx, w, h);
        if (this.scene !== "bed") {
          this.drawClock(ctx, w - 76, 56, this.questionIndex);
        }
        const avatarScale = Math.min(w, h) / 330;
        const ax = this.scene === "intro" ? w * 0.5 : w * 0.22;
        const ay = this.scene === "intro" ? h * 0.62 : h * 0.68;
        Avatar.drawAt(ctx, this.type, ax, ay, avatarScale, this.t);
        if (this.selected) {
          this.drawSelectionBurst(ctx, w, h, this.selected);
        }
      }

      drawRoom(ctx, w, h) {
        const wall = ctx.createLinearGradient(0, 0, 0, h);
        wall.addColorStop(0, "#fff6e6");
        wall.addColorStop(0.58, "#fffaf0");
        wall.addColorStop(0.59, "#d8bd96");
        wall.addColorStop(1, "#c69b6c");
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(16,24,39,0.06)";
        for (let x = -40; x < w + 40; x += 42) ctx.fillRect(x, h * 0.59, 1, h * 0.41);
        for (let y = h * 0.59; y < h; y += 42) ctx.fillRect(0, y, w, 1);
        CanvasTools.round(ctx, 20, 18, w - 40, h * 0.56, 20, "rgba(255,255,255,0.5)", "rgba(16,24,39,0.15)", 1);
      }

      drawSceneDetails(ctx, w, h) {
        if (this.scene === "office") this.drawOffice(ctx, w, h);
        if (this.scene === "elevator") this.drawElevator(ctx, w, h);
        if (this.scene === "desk") this.drawDesk(ctx, w, h);
        if (this.scene === "meeting") this.drawMeeting(ctx, w, h);
        if (this.scene === "pantry") this.drawPantry(ctx, w, h);
        if (this.scene === "lunch") this.drawLunch(ctx, w, h);
        if (this.scene === "boss") this.drawBossScene(ctx, w, h);
        if (this.scene === "typing") this.drawTyping(ctx, w, h);
        if (this.scene === "strategy") this.drawStrategy(ctx, w, h);
        if (this.scene === "toilet") this.drawToilet(ctx, w, h);
        if (this.scene === "deadline") this.drawDeadline(ctx, w, h);
        if (this.scene === "bed") this.drawBed(ctx, w, h);
        if (this.scene === "intro") this.drawIntroStage(ctx, w, h);
      }

      drawClock(ctx, x, y, index) {
        const minute = String(index * 4).padStart(2, "0");
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#101827";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        CanvasTools.text(ctx, `09:${minute}`, x, y + 48, 13, "#101827");
        ctx.strokeStyle = "#101827";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - 18);
        ctx.moveTo(x, y);
        ctx.lineTo(x + 16, y);
        ctx.stroke();
      }

      drawWindow(ctx, x, y, w, h) {
        CanvasTools.round(ctx, x, y, w, h, 12, "#bfe1f0", "#6c98a9", 3);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + w / 2, y + 6);
        ctx.lineTo(x + w / 2, y + h - 6);
        ctx.moveTo(x + 6, y + h / 2);
        ctx.lineTo(x + w - 6, y + h / 2);
        ctx.stroke();
      }

      drawOffice(ctx, w, h) {
        this.drawWindow(ctx, w - 184, 36, 108, 92);
        const labels = ["A", "B", "C", "D"];
        const xs = [w * 0.48, w * 0.72, w * 0.48, w * 0.72];
        const ys = [h * 0.38, h * 0.38, h * 0.63, h * 0.63];
        labels.forEach((label, i) => this.drawSeat(ctx, xs[i], ys[i], label));
        this.drawPlant(ctx, w - 60, h * 0.67);
      }

      drawSeat(ctx, x, y, label) {
        const active = this.selected === label;
        CanvasTools.round(ctx, x - 58, y - 34, 116, 70, 14, active ? "#ffe28a" : "#fff", "#101827", active ? 4 : 2);
        CanvasTools.round(ctx, x - 40, y - 8, 80, 18, 5, "#bd8652");
        CanvasTools.round(ctx, x - 20, y - 32, 42, 25, 5, "#303847");
        CanvasTools.round(ctx, x - 16, y - 29, 34, 17, 4, "#b8d6e1");
        CanvasTools.text(ctx, label, x - 42, y - 18, 18, "#101827");
      }

      drawPlant(ctx, x, y) {
        CanvasTools.round(ctx, x - 18, y + 34, 36, 30, 5, "#b17245", "#6b472f", 1);
        ctx.strokeStyle = "#2f7c4f";
        ctx.lineWidth = 4;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(x, y + 38);
          ctx.quadraticCurveTo(x + i * 13, y + 13, x + i * 18, y);
          ctx.stroke();
          ctx.fillStyle = "#3f9b65";
          ctx.beginPath();
          ctx.ellipse(x + i * 18, y, 8, 15, i * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawIntroStage(ctx, w, h) {
        ctx.fillStyle = "rgba(243,189,46,0.18)";
        ctx.beginPath();
        ctx.moveTo(w * 0.5, 20);
        ctx.lineTo(w * 0.78, h * 0.72);
        ctx.lineTo(w * 0.22, h * 0.72);
        ctx.closePath();
        ctx.fill();
        CanvasTools.text(ctx, "09:00 开机中", w * 0.5, 48, 20, "#101827");
      }

      drawElevator(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.47, h * 0.18, w * 0.34, h * 0.46, 8, "#d7dee8", "#101827", 3);
        ctx.strokeStyle = "#101827";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w * 0.64, h * 0.18);
        ctx.lineTo(w * 0.64, h * 0.64);
        ctx.stroke();
        CanvasTools.text(ctx, "↑ 4min", w * 0.64, h * 0.27, 22, "#ef6b3a");
        for (let i = 0; i < 5; i++) this.drawTinyPerson(ctx, w * (0.43 + i * 0.08), h * 0.7, i);
      }

      drawTinyPerson(ctx, x, y, i) {
        ctx.fillStyle = ["#f3bd2e", "#0f7357", "#ef6b3a", "#4568f0", "#101827"][i % 5];
        ctx.beginPath();
        ctx.arc(x, y - 22, 10, 0, Math.PI * 2);
        ctx.fill();
        CanvasTools.round(ctx, x - 10, y - 12, 20, 32, 7, "#f1c089");
      }

      drawDesk(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.42, h * 0.46, w * 0.42, 34, 6, "#bd8652", "#101827", 2);
        CanvasTools.round(ctx, w * 0.52, h * 0.34, 110, 66, 8, "#303847", "#101827", 2);
        CanvasTools.round(ctx, w * 0.535, h * 0.36, 82, 44, 5, "#b8d6e1");
        CanvasTools.text(ctx, "拼好饭?", w * 0.67, h * 0.28, 18, "#0f7357");
        this.drawPlant(ctx, w * 0.84, h * 0.45);
      }

      drawMeeting(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.38, h * 0.31, w * 0.5, h * 0.32, 14, "#fff", "#101827", 3);
        CanvasTools.text(ctx, "PPT 第 88 页", w * 0.63, h * 0.39, 22, "#101827");
        CanvasTools.text(ctx, "请发表看法", w * 0.63, h * 0.49, 18, "#ef6b3a");
        for (let i = 0; i < 4; i++) this.drawTinyPerson(ctx, w * (0.44 + i * 0.1), h * 0.72, i);
      }

      drawPantry(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.5, h * 0.25, 92, 128, 12, "#d7dee8", "#101827", 3);
        CanvasTools.text(ctx, "咖啡", w * 0.5 + 46, h * 0.32, 18, "#101827");
        CanvasTools.round(ctx, w * 0.62, h * 0.45, 120, 70, 14, "#fff", "#101827", 2);
        CanvasTools.text(ctx, "八卦会", w * 0.68, h * 0.5, 20, "#ef6b3a");
        for (let i = 0; i < 4; i++) this.drawTinyPerson(ctx, w * (0.5 + i * 0.08), h * 0.73, i);
      }

      drawLunch(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.46, h * 0.34, 160, 98, 16, "#fff", "#101827", 3);
        CanvasTools.text(ctx, "午饭吃什么", w * 0.46 + 80, h * 0.41, 22, "#101827");
        CanvasTools.text(ctx, "满 25 减 4", w * 0.46 + 80, h * 0.51, 18, "#0f7357");
        ctx.fillStyle = "#f3bd2e";
        ctx.beginPath();
        ctx.arc(w * 0.78, h * 0.64, 34, 0, Math.PI * 2);
        ctx.fill();
      }

      drawBossScene(ctx, w, h) {
        this.drawDesk(ctx, w, h);
        CanvasTools.round(ctx, w * 0.62, h * 0.31, 118, 74, 10, "#fff", "#101827", 3);
        CanvasTools.text(ctx, "泡澡10h", w * 0.62 + 59, h * 0.39, 18, "#0f7357");
        this.drawTinyPerson(ctx, w * 0.82, h * 0.66, 4);
        CanvasTools.text(ctx, "老板", w * 0.82, h * 0.75, 14, "#101827");
      }

      drawTyping(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.44, h * 0.43, 190, 42, 7, "#303847", "#101827", 3);
        for (let i = 0; i < 12; i++) {
          ctx.fillStyle = i % 3 === 0 ? "#f3bd2e" : "#fff";
          ctx.fillRect(w * 0.46 + i * 12, h * 0.46, 8, 7);
        }
        CanvasTools.text(ctx, "噼里啪啦", w * 0.66, h * 0.32, 26, "#ef6b3a");
      }

      drawStrategy(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.42, h * 0.26, w * 0.47, h * 0.34, 16, "#fff", "#101827", 3);
        CanvasTools.text(ctx, "深化抓手", w * 0.66, h * 0.34, 22, "#101827");
        CanvasTools.text(ctx, "强化闭环", w * 0.66, h * 0.44, 22, "#101827");
        CanvasTools.text(ctx, "价值颗粒度", w * 0.66, h * 0.54, 22, "#ef6b3a");
      }

      drawToilet(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.5, h * 0.33, 120, 150, 18, "#e6eef4", "#101827", 3);
        CanvasTools.round(ctx, w * 0.53, h * 0.45, 80, 56, 14, "#fff", "#101827", 2);
        CanvasTools.text(ctx, "25:00", w * 0.65, h * 0.3, 28, "#ef6b3a");
      }

      drawDeadline(ctx, w, h) {
        CanvasTools.round(ctx, w * 0.44, h * 0.31, 170, 110, 14, "#fff", "#101827", 3);
        CanvasTools.text(ctx, "36min", w * 0.44 + 85, h * 0.4, 32, "#ef6b3a");
        CanvasTools.text(ctx, "新任务", w * 0.44 + 85, h * 0.52, 22, "#101827");
        ctx.fillStyle = "#f3bd2e";
        ctx.fillRect(w * 0.74, h * 0.5, 56, 56);
      }

      drawBed(ctx, w, h) {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#222838");
        g.addColorStop(1, "#4c3f65");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        for (let i = 0; i < 30; i++) {
          const x = (i * 73) % w;
          const y = (i * 41) % (h * 0.55);
          ctx.fillRect(x, y, 2, 2);
        }
        CanvasTools.round(ctx, w * 0.42, h * 0.56, w * 0.46, 88, 18, "#fffaf0", "#101827", 3);
        CanvasTools.round(ctx, w * 0.45, h * 0.48, 90, 52, 14, "#f3bd2e", "#101827", 3);
        CanvasTools.text(ctx, "周日 23:59", w * 0.68, h * 0.34, 24, "#fff");
      }

      drawSelectionBurst(ctx, w, h, label) {
        ctx.fillStyle = "rgba(243,189,46,0.22)";
        ctx.beginPath();
        ctx.arc(w * 0.74, h * 0.28, 72 + Math.sin(this.t / 120) * 8, 0, Math.PI * 2);
        ctx.fill();
        CanvasTools.text(ctx, `选择 ${label}`, w * 0.74, h * 0.28, 32, "#101827");
      }

      loop(last = performance.now()) {
        const now = performance.now();
        this.update(Math.min(50, now - last));
        this.draw();
        requestAnimationFrame(() => this.loop(now));
      }
    }

    class App {
      constructor() {
        this.screens = {
          home: document.getElementById("homeScreen"),
          play: document.getElementById("playScreen"),
          result: document.getElementById("resultScreen"),
          atlas: document.getElementById("atlasScreen")
        };
        this.state = {
          mode: "home",
          introIndex: 0,
          qIndex: 0,
          scores: { perform: 0, escape: 0, chaos: 0, survive: 0 },
          logs: [],
          answers: [],
          shareCode: "",
          lastScreen: "home",
          result: null
        };
        this.bg = new BackgroundFX(document.getElementById("bgCanvas"));
        this.scene = new SceneRenderer(document.getElementById("sceneCanvas"));
        this.bind();
        this.renderAtlas();
        this.drawStaticAvatars();
        this.bg.loop();
        this.scene.loop();
      }

      bind() {
        document.getElementById("startBtn").addEventListener("click", () => this.start());
        document.getElementById("quickAtlasBtn").addEventListener("click", () => this.showAtlas());
        document.getElementById("atlasTopBtn").addEventListener("click", () => this.showAtlas());
        document.getElementById("continueBtn").addEventListener("click", () => this.nextIntro());
        document.getElementById("restartBtn").addEventListener("click", () => this.start());
        document.getElementById("showAtlasBtn").addEventListener("click", () => this.showAtlas());
        document.getElementById("backBtn").addEventListener("click", () => this.show(this.state.lastScreen || "home"));
        document.getElementById("copyCodeBtn").addEventListener("click", () => this.copyCode());
        document.getElementById("matchBtn").addEventListener("click", () => this.queryMatch());
        window.addEventListener("resize", () => this.drawStaticAvatars());
      }

      show(name) {
        Object.keys(this.screens).forEach(key => this.screens[key].classList.toggle("active", key === name));
        if (name !== "atlas") this.state.lastScreen = name;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      start() {
        this.state.introIndex = 0;
        this.state.qIndex = 0;
        this.state.scores = { perform: 0, escape: 0, chaos: 0, survive: 0 };
        this.state.logs = [];
        this.state.answers = [];
        this.state.shareCode = "";
        this.state.result = null;
        this.show("play");
        this.renderIntro();
        this.renderProgress();
        this.bg.burst(window.innerWidth * 0.5, window.innerHeight * 0.32, "#f3bd2e");
      }

      renderIntro() {
        const item = INTRO[this.state.introIndex];
        const type = TYPE_DATA[item.type] || TYPE_DATA.HHLH;
        document.getElementById("speakerName").textContent = item.speaker;
        document.getElementById("progressText").textContent = "开场动画";
        document.getElementById("dialogueText").textContent = item.text;
        document.getElementById("dialogueSub").textContent = item.sub;
        document.getElementById("choices").innerHTML = "";
        document.getElementById("continueRow").style.display = "flex";
        document.getElementById("continueBtn").textContent = this.state.introIndex === INTRO.length - 1 ? "开始选择" : "继续";
        this.scene.set(item.scene, type, 0);
      }

      nextIntro() {
        if (this.state.introIndex < INTRO.length - 1) {
          this.state.introIndex += 1;
          this.renderIntro();
          this.bg.burst(window.innerWidth * 0.45, window.innerHeight * 0.42, "#0f7357");
          return;
        }
        this.renderQuestion();
      }

      renderQuestion() {
        const q = QUESTIONS[this.state.qIndex];
        document.getElementById("speakerName").textContent = q.speaker;
        document.getElementById("progressText").textContent = `第 ${this.state.qIndex + 1} / ${QUESTIONS.length} 题`;
        document.getElementById("dialogueText").textContent = q.text;
        document.getElementById("dialogueSub").textContent = q.sub;
        document.getElementById("continueRow").style.display = "none";
        this.scene.set(q.scene, this.currentGuideType(), this.state.qIndex);
        const choices = document.getElementById("choices");
        choices.innerHTML = "";
        q.options.forEach((opt, index) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.type = "button";
          btn.style.animationDelay = `${index * 42}ms`;
          btn.innerHTML = `<b>${opt[0]}</b><span>${opt[1]}</span>`;
          btn.addEventListener("click", () => this.answer(opt));
          choices.appendChild(btn);
        });
        this.renderProgress();
      }

      currentGuideType() {
        const cycle = ["HHLH", "LHLL", "LHHL", "LLHH", "HHHL", "LHLH"];
        return TYPE_DATA[cycle[this.state.qIndex % cycle.length]];
      }

      answer(opt) {
        const effect = opt[2] || {};
        Object.keys(effect).forEach(key => {
          this.state.scores[key] += effect[key];
        });
        const q = QUESTIONS[this.state.qIndex];
        this.state.answers.push({
          question: this.state.qIndex + 1,
          choice: opt[0],
          text: opt[1]
        });
        this.state.logs.unshift(`Q${this.state.qIndex + 1} 选择 ${opt[0]}：精神波动已记录`);
        this.state.logs = this.state.logs.slice(0, 4);
        this.scene.set(q.scene, this.currentGuideType(), this.state.qIndex, opt[0]);
        this.bg.burst(window.innerWidth * (0.35 + Math.random() * 0.35), window.innerHeight * 0.42, "#f3bd2e");
        this.renderProgress();
        setTimeout(() => {
          this.state.qIndex += 1;
          if (this.state.qIndex >= QUESTIONS.length) {
            this.finish();
          } else {
            this.renderQuestion();
          }
        }, 520);
      }

      renderProgress() {
        const percent = Math.min(100, (this.state.qIndex / QUESTIONS.length) * 100);
        document.getElementById("progressFill").style.width = `${percent}%`;
        const status = document.getElementById("statusCard");
        if (this.state.qIndex === 0) {
          status.textContent = "四维结果暂时隐藏。请按直觉选择，不要试图维护形象，系统比老板更懂你。";
        } else {
          status.textContent = "后台维度正在累计，但暂不显示。你只需要继续扮演一个正常上班的人类。";
        }
        const log = document.getElementById("miniLog");
        log.innerHTML = this.state.logs.map(text => `<div class="log-item">${text}</div>`).join("");
      }

      finish() {
        const code = DIMENSIONS.map(dim => this.state.scores[dim.key] >= dim.threshold ? "H" : "L").join("");
        const result = TYPE_DATA[code] || TYPE_DATA.LLLL;
        this.state.result = { ...result, code };
        Store.save({ code, scores: this.state.scores, at: Date.now() });
        this.renderResult();
        this.saveResultToBackend();
        this.show("result");
        this.bg.burst(window.innerWidth * 0.52, window.innerHeight * 0.33, "#ef6b3a");
      }

      renderResult() {
        const result = this.state.result;
        document.getElementById("resultName").textContent = result.cn;
        document.getElementById("resultCode").textContent = result.en;
        document.getElementById("resultDesc").textContent = result.desc;
        document.getElementById("resultSlogan").textContent = result.slogan;
        Avatar.draw(document.getElementById("resultAvatar"), result, performance.now());

        const chips = document.getElementById("resultChips");
        chips.innerHTML = "";
        DIMENSIONS.forEach((dim, index) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = `${dim.cn}: ${result.code[index] === "H" ? "H 高" : "L 低"}`;
          chips.appendChild(chip);
        });

        const scores = document.getElementById("resultScores");
        scores.innerHTML = "";
        DIMENSIONS.forEach(dim => {
          const value = this.state.scores[dim.key];
          const item = document.createElement("div");
          item.className = "score-item";
          item.innerHTML = `
            <strong><span>${dim.cn} ${dim.en}</span><span>${value}/${dim.max}</span></strong>
            <div class="meter-track"><span class="meter-fill" style="width:${Math.min(100, value / dim.max * 100)}%; background:${dim.color}"></span></div>
          `;
          scores.appendChild(item);
        });
        this.state.shareCode = "";
        document.getElementById("shareCode").textContent = "生成中";
        document.getElementById("shareHint").textContent = "正在连接本地后端保存结果。";
        document.getElementById("matchCodeA").value = "";
        document.getElementById("matchCodeB").value = "";
        document.getElementById("matchResult").classList.remove("show");
      }

      async saveResultToBackend() {
        const result = this.state.result;
        const hint = document.getElementById("shareHint");
        const codeEl = document.getElementById("shareCode");
        try {
          const data = await ApiClient.saveResult({
            mytiCode: result.code,
            typeCn: result.cn,
            typeEn: result.en,
            scores: this.state.scores,
            answers: this.state.answers,
            createdAt: new Date().toISOString()
          });
          this.state.shareCode = data.shareCode;
          codeEl.textContent = data.shareCode;
          document.getElementById("matchCodeA").value = data.shareCode;
          hint.textContent = "把这个代码发给朋友，对方测完后互相输入代码即可查询匹配度。";
        } catch (error) {
          codeEl.textContent = "离线";
          hint.textContent = "当前是直接打开文件的离线模式。请运行 server.js 后从 http://localhost:3000 打开页面，才能保存结果和生成匹配代码。";
        }
      }

      async copyCode() {
        if (!this.state.shareCode) return;
        try {
          await navigator.clipboard.writeText(this.state.shareCode);
          document.getElementById("shareHint").textContent = "代码已复制，可以发给朋友互测。";
        } catch (error) {
          document.getElementById("shareHint").textContent = `请手动复制代码：${this.state.shareCode}`;
        }
      }

      async queryMatch() {
        const codeA = document.getElementById("matchCodeA").value.trim().toUpperCase();
        const codeB = document.getElementById("matchCodeB").value.trim().toUpperCase();
        const box = document.getElementById("matchResult");
        box.classList.add("show");
        if (!codeA || !codeB) {
          box.innerHTML = `<strong>还差一个代码</strong><p class="match-text">请输入两个人的匹配代码。</p>`;
          return;
        }
        box.innerHTML = `<strong>匹配计算中</strong><p class="match-text">正在读取两个人的 MYTI 精神档案。</p>`;
        try {
          const data = await ApiClient.getMatch(codeA, codeB);
          box.innerHTML = `
            <strong>${data.pairTitle}</strong>
            <div class="match-score">${data.score}%</div>
            <p class="match-text">${data.summary}</p>
            <p class="match-text">${data.analysis}</p>
          `;
        } catch (error) {
          box.innerHTML = `<strong>查询失败</strong><p class="match-text">${error.message || "没有查到这组代码，请确认后端已启动，且代码输入正确。"}</p>`;
        }
      }

      showAtlas() {
        this.show("atlas");
        requestAnimationFrame(() => this.drawAtlasAvatars());
      }

      renderAtlas() {
        const grid = document.getElementById("atlasGrid");
        grid.innerHTML = Object.keys(TYPE_DATA).map(code => {
          const type = TYPE_DATA[code];
          const dims = code.split("").map((v, i) => {
            const label = ["演", "摸", "疯", "生"][i];
            return `<span class="dim ${v === "H" ? "high" : ""}">${label}${v}</span>`;
          }).join("");
          return `
            <article class="atlas-card" data-code="${code}">
              <canvas class="mini-avatar" width="260" height="150"></canvas>
              <div>
                <h3>${type.cn}</h3>
                <div class="en">${type.en}</div>
                <div class="dims">${dims}</div>
                <p>${type.desc}</p>
              </div>
            </article>
          `;
        }).join("");
      }

      drawAtlasAvatars() {
        document.querySelectorAll(".atlas-card").forEach(card => {
          const code = card.dataset.code;
          const canvas = card.querySelector("canvas");
          if (TYPE_DATA[code] && canvas) Avatar.draw(canvas, TYPE_DATA[code], performance.now());
        });
      }

      drawStaticAvatars() {
        Avatar.draw(document.getElementById("heroAvatar"), TYPE_DATA.HHLH, performance.now());
        if (this.state.result) Avatar.draw(document.getElementById("resultAvatar"), this.state.result, performance.now());
        this.drawAtlasAvatars();
      }
    }

    const errorHandler = new ErrorHandler();
    errorHandler.run(() => new App());
  </script>
</body>
